# Include inside this game's server block BEFORE static asset regex locations.
# OSPanel regenerates its generated configs: retain/reapply this include when
# changing the server profile. Apache also enforces the repository .htaccess.
location ~* ^/(?:_incoming|config|database|docs|src|storage|tools|vendor)(?:/|$) { deny all; }
location ~* ^/_qa-(?:view|viewport)\.php$ { deny all; }
location ~ /\.(?!well-known/) { deny all; }
location ~* \.(?:sql|log|zip|rar|7z|tar|gz|bak|md|xlsx|py|ps1)$ { deny all; }
